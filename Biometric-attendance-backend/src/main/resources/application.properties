# ==========================================================
# Al-Ihsan Girls Secondary School - Biometric Attendance
# ==========================================================

# ---------- MySQL ----------
# createDatabaseIfNotExist=true lets MySQL create the database on first start.
# (Database name kept exactly as in the original project.)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biometric_atttendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# update = create/alter tables automatically. Employee ID is now a VARCHAR primary key,
# so run database/reset_database.sql ONCE if you already have the old (BIGINT) tables.
spring.jpa.hibernate.ddl-auto=update

# ---------- Server ----------
server.port=8080

# ---------- WebAuthn tables ----------
# Runs schema.sql (CREATE TABLE IF NOT EXISTS) so a fresh database on another PC works.
spring.sql.init.mode=always

# ---------- WebAuthn (fingerprint) ----------
# rp-id must be a DOMAIN NAME (never an IP) and must match the address in the browser.
# Local PC:            rp-id=localhost
# Phone on WiFi (test): rp-id=10-4-11-118.sslip.io  (sslip.io turns it into 10.4.11.118)
app.webauthn.rp-id=${WEBAUTHN_RP_ID:refinish-shaft-suspend.ngrok-free.dev}
app.webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS:https://refinish-shaft-suspend.ngrok-free.dev}

# ==========================================================
# Improvements added (all values can be overridden with environment variables)
# ==========================================================

# ---------- School time zone (used for "today", late status and Mon-Sun weeks) ----------
app.timezone=${APP_TIMEZONE:Africa/Dar_es_Salaam}

# ---------- Password reset ----------
# Public address of the FRONTEND, used to build the link sent by e-mail.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# How long a reset link stays valid (minutes). Each link works once.
app.password-reset.token-minutes=${APP_RESET_TOKEN_MINUTES:30}

# ---------- Mail (SMTP) ----------
# NO credentials are stored in this file. Either set these environment variables:
#   MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD (MAIL_FROM is optional)
# or copy mail.properties.example to mail.properties (next to pom.xml) and fill it in.
spring.config.import=optional:file:./mail.properties
# While MAIL_HOST is empty the reset e-mail is NOT sent (the server logs a warning only,
# never the link) so nobody can reset a password without real e-mail access.
# The startup log says "E-mail is ON" or "E-mail is OFF".
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
# Port 587 -> STARTTLS (default).  Port 465 -> set MAIL_SSL=true and MAIL_STARTTLS=false.
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.ssl.trust=${spring.mail.host:}
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_FROM:}
spring.mail.test-connection=false

# ---------- Session cookie hardening ----------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
# Set SESSION_COOKIE_SECURE=true when the site is served over HTTPS (production).
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=8h

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# ---------- Do not leak internals in error responses ----------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.jpa.show-sql=false
